name: Electronics Remote (Windows x64 + Android)

# Build interno de «Electronics Remote» (fork de RustDesk 1.5.0, AGPL-3.0).
# Solo Windows x64 (Flutter) y Android (APK universal arm64 + armv7).
# Basado en los jobs build-for-windows-flutter, build-rustdesk-android y
# build-rustdesk-android-universal de flutter-build.yml, sin firmas ni pasos
# que dependan de secrets de RustDesk. La marca se aplica con branding/apply.sh.

on:
  workflow_dispatch:
    inputs:
      rendezvous_server:
        description: "Servidor propio (hbbs) host[:puerto]. Vacio solo si placeholder=true"
        type: string
        required: false
        default: ""
      rs_pub_key:
        description: "Llave publica del servidor (contenido de id_ed25519.pub, 44 caracteres)"
        type: string
        required: false
        default: ""
      api_server:
        description: "Panel API (lejianwen/rustdesk-api), ej. http://IP:21114. Vacio = http://<servidor>:21114"
        type: string
        required: false
        default: ""
      release_from_run:
        description: "Solo publicar: ID de una corrida anterior cuyos artefactos se suben (no compila)"
        type: string
        required: false
        default: ""
      placeholder:
        description: "Prueba de compilacion sin servidor (pendiente.invalid + llave original). Publica como prerelease"
        type: boolean
        default: false

env:
  RUST_VERSION: "1.75"
  SCITER_RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.0"
  NDK_VERSION: "r28c"
  # Version propia: la compila el cliente (option_env! ER_VERSION) y la lleva el
  # tag del release; el actualizador compara contra releases/latest de este repo.
  ER_VERSION: "1.5.0-er.${{ github.run_number }}"
  RELEASE_TAG: "electronics-remote-1.5.0-er.${{ github.run_number }}"
  # Marca (las lee branding/apply.sh)
  RENDEZVOUS_SERVER: ${{ inputs.rendezvous_server }}
  RS_PUB_KEY: ${{ inputs.rs_pub_key }}
  API_SERVER: ${{ inputs.api_server }}
  ALLOW_PLACEHOLDER: ${{ inputs.placeholder && '1' || '0' }}

permissions:
  contents: read

jobs:
  check-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Validar servidor y llave
        shell: bash
        run: |
          if [ "$ALLOW_PLACEHOLDER" != "1" ] && { [ -z "$RENDEZVOUS_SERVER" ] || [ -z "$RS_PUB_KEY" ]; }; then
            echo "::error::Faltan rendezvous_server y rs_pub_key (o marca placeholder=true para solo probar compilacion)"
            exit 1
          fi
          echo "servidor=${RENDEZVOUS_SERVER:-pendiente.invalid} api=${API_SERVER:-(derivado)} placeholder=$ALLOW_PLACEHOLDER"

  generate-bridge:
    needs: [check-inputs]
    if: ${{ inputs.release_from_run == '' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-ubuntu-22.04

      - name: Cache Bridge
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: /tmp/flutter_rust_bridge
          key: bridge-${{ env.BRIDGE_FLUTTER_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build-topmostwindow-x64:
    needs: [check-inputs]
    if: ${{ inputs.release_from_run == '' }}
    runs-on: windows-2022
    steps:
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Download the source code
        run: git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow

      - name: Build the project
        run: |
          cd RustDeskTempTopMostWindow && git checkout ecd8d6a139eee76845ea66423fb739af450fda90
          msbuild WindowInjection/WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10

      - name: Archive build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: ./RustDeskTempTopMostWindow/WindowInjection/x64/Release/WindowInjection.dll

  build-windows-x64:
    name: windows x64 (flutter)
    needs: [generate-bridge, build-topmostwindow-x64]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Aplicar marca Electronics Remote
        shell: bash
        run: bash branding/apply.sh

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: electronics-windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          # El instalador de RustDesk instala y crea el servicio con <APP_NAME>.exe
          # (como los clientes personalizados); con rustdesk.exe el servicio queda
          # apuntando a un exe que no existe.
          mv ./rustdesk/rustdesk.exe ./rustdesk/ElectronicsRemote.exe

          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums
            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } else {
                Write-Output "printer driver: checksums do not match, ignore the files."
            }
          } catch {
              Write-Host "Ignore the printer driver error."
          }

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/ElectronicsRemote.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/ElectronicsRemote-x64.exe
          # «Electronics Remote Equipo» (solo recibir): mismo build; el nombre del
          # exe (ElectronicsRemoteEquipo.exe) activa APP_NAME propio + incoming-only
          # (er_apply_equipo_mode en src/common.rs).
          cp -r ./rustdesk ./rustdesk-equipo
          mv ./rustdesk-equipo/ElectronicsRemote.exe ./rustdesk-equipo/ElectronicsRemoteEquipo.exe
          pushd ./libs/portable
          python3 ./generate.py -f ../../rustdesk-equipo/ -o . -e ../../rustdesk-equipo/ElectronicsRemoteEquipo.exe
          popd
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/ElectronicsRemoteEquipo-x64.exe
          ls -la ./SignOutput

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build msi
        continue-on-error: true
        run: |
          # copia limpia de res/msi para el msi del «Equipo» (preprocess.py edita en sitio)
          cp -r ./res/msi ./res/msi-equipo
          cp -r ./rustdesk ./rustdesk-msi
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk-msi --app-name "ElectronicsRemote" -m "Electronics Mexico" -v ${{ env.VERSION }} --revision-version ${{ github.run_number }}
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName ../../SignOutput/ElectronicsRemote-x64.msi
          popd

      - name: Build msi (Equipo)
        continue-on-error: true
        run: |
          cp -r ./rustdesk-equipo ./rustdesk-msi-equipo
          pushd ./res/msi-equipo
          python preprocess.py --arp -d ../../rustdesk-msi-equipo --app-name "ElectronicsRemoteEquipo" -m "Electronics Mexico" -v ${{ env.VERSION }} --revision-version ${{ github.run_number }} --conn-type incoming
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName ../../SignOutput/ElectronicsRemoteEquipo-x64.msi
          popd

      - name: Upload Windows build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: electronics-remote-windows-x86_64
          path: ./SignOutput/*

  build-android-lib:
    needs: [generate-bridge]
    name: android lib ${{ matrix.job.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { arch: aarch64, target: aarch64-linux-android, abi: arm64-v8a, script: ndk_arm64.sh }
          - { arch: armv7, target: armv7-linux-androideabi, abi: armeabi-v7a, script: ndk_arm.sh }
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib git g++ g++-multilib \
               libayatana-appindicator3-dev libasound2-dev libc6-dev libclang-dev libunwind-dev \
               libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libpulse-dev libva-dev \
               libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev \
               llvm-dev nasm ninja-build openjdk-17-jdk-headless pkg-config tree wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Aplicar marca Electronics Remote
        shell: bash
        run: bash branding/apply.sh

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! ./flutter/build_android_deps.sh "${{ matrix.job.abi }}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: electronics-android-lib
          key: ${{ matrix.job.target }}

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/${{ matrix.job.script }}

      - name: Upload Rustdesk library to Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: librustdesk.so.${{ matrix.job.target }}
          path: ./target/${{ matrix.job.target }}/release/liblibrustdesk.so

  build-android-apk:
    needs: [build-android-lib]
    name: android apk universal (arm64 + armv7)
    runs-on: ubuntu-24.04
    env:
      ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl git g++ libclang-dev llvm-dev nasm ninja-build openjdk-17-jdk-headless pkg-config wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Aplicar marca Electronics Remote
        shell: bash
        run: bash branding/apply.sh

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Download arm64 lib
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: librustdesk.so.aarch64-linux-android
          path: ./flutter/android/app/src/main/jniLibs/arm64-v8a

      - name: Download armv7 lib
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: librustdesk.so.armv7-linux-androideabi
          path: ./flutter/android/app/src/main/jniLibs/armeabi-v7a

      - name: Build apk
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # Se compila con la config debug y despues se re-firma con la keystore fija (secrets)
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          JNI=./flutter/android/app/src/main/jniLibs
          SYSROOT=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib
          mv $JNI/arm64-v8a/liblibrustdesk.so $JNI/arm64-v8a/librustdesk.so
          cp $SYSROOT/aarch64-linux-android/libc++_shared.so $JNI/arm64-v8a/
          mv $JNI/armeabi-v7a/liblibrustdesk.so $JNI/armeabi-v7a/librustdesk.so
          cp $SYSROOT/arm-linux-androideabi/libc++_shared.so $JNI/armeabi-v7a/
          pushd flutter
          flutter build apk --release --target-platform android-arm64,android-arm
          popd
          mkdir -p signed-apk out
          mv ./flutter/build/app/outputs/flutter-apk/app-release.apk signed-apk/ElectronicsRemote.apk

      - name: Setup sign tool version variable
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "ANDROID_SIGN_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV

      - uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        name: Firmar APK con la keystore fija
        if: env.ANDROID_SIGNING_KEY != ''
        id: sign-apk
        with:
          releaseDirectory: ./signed-apk
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.ANDROID_SIGN_TOOL_VERSION }}

      - name: Nombre estable del APK
        shell: bash
        run: |
          if [ -n "${{ steps.sign-apk.outputs.signedReleaseFile }}" ]; then
            mv "${{ steps.sign-apk.outputs.signedReleaseFile }}" out/ElectronicsRemote.apk
            echo "APK firmado con la keystore fija"
          else
            mv signed-apk/ElectronicsRemote.apk out/ElectronicsRemote.apk
            echo "::warning::Sin ANDROID_SIGNING_KEY: APK con llave debug (no actualiza encima)"
          fi
          "/usr/local/lib/android/sdk/build-tools/${ANDROID_SIGN_TOOL_VERSION}/apksigner" verify --print-certs out/ElectronicsRemote.apk
          BADGING=$("/usr/local/lib/android/sdk/build-tools/${ANDROID_SIGN_TOOL_VERSION}/aapt2" dump badging out/ElectronicsRemote.apk)
          grep -E "^package:|^application-label:" <<< "$BADGING"
          grep -q "^package: name='com.electronicsmexico.remote'" <<< "$BADGING"             || { echo "::error::El APK no trae el package com.electronicsmexico.remote"; exit 1; }

      - name: Upload apk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: electronics-remote-android-universal
          path: out/*.apk

  test-silent-install:
    name: prueba instalacion silenciosa (${{ matrix.prueba }})
    needs: [build-windows-x64]
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # completo; «Equipo» (solo recibir); y con el completo ya puesto, «Equipo»
          # debe NEGARSE a instalarse (mismo ID con otra llave = conexiones fallan)
          - { prueba: completo, apps: "ElectronicsRemote", negado: "" }
          - { prueba: equipo, apps: "ElectronicsRemoteEquipo", negado: "" }
          - { prueba: ambos, apps: "ElectronicsRemote", negado: "ElectronicsRemoteEquipo" }
    env:
      APPS: ${{ matrix.apps }}
      NEGADO: ${{ matrix.negado }}
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: electronics-remote-windows-x86_64
          path: dist

      # Sin esto el servicio instalado en la VM se registra en NUESTRO servidor y
      # en el panel (aparecen equipos «runnervm…» después de cada compilación).
      - name: Aislar la VM del servidor propio (no registrarse en hbbs ni en el panel)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $hosts = @()
          foreach ($v in @($env:RENDEZVOUS_SERVER, $env:API_SERVER)) {
            if ([string]::IsNullOrWhiteSpace($v)) { continue }
            $h = $v -replace '^[a-zA-Z]+://', ''
            $h = ($h -split '/')[0]
            if ($h -match '^\[(.+)\]') { $h = $Matches[1] } elseif (($h.Split(':')).Count -eq 2) { $h = $h.Split(':')[0] }
            if ($h) { $hosts += $h }
          }
          $ips = @()
          foreach ($h in ($hosts | Select-Object -Unique)) {
            $parsed = $null
            if ([System.Net.IPAddress]::TryParse($h, [ref]$parsed)) { $ips += $h; continue }
            try { $ips += [System.Net.Dns]::GetHostAddresses($h) | ForEach-Object { $_.IPAddressToString } } catch { Write-Host "no resuelve $h" }
            Add-Content -Path "$env:windir\System32\drivers\etc\hosts" -Value "0.0.0.0 $h"
          }
          $ips = $ips | Select-Object -Unique
          if ($ips.Count -gt 0) {
            New-NetFirewallRule -DisplayName 'ER-CI-bloquear-servidor' -Direction Outbound -Action Block -RemoteAddress $ips | Out-Null
            New-NetFirewallRule -DisplayName 'ER-CI-bloquear-servidor-in' -Direction Inbound -Action Block -RemoteAddress $ips | Out-Null
          }
          Write-Host "bloqueados: hosts=$($hosts -join ',') ips=$($ips -join ',')"

      - name: Instalar con --silent-install y verificar (servicio Auto + LocalSystem)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path test-logs | Out-Null
          $fallas = @()
          foreach ($app in $env:APPS.Split(' ')) {
            $exe = Resolve-Path "dist/$app-x64.exe"
            Write-Host "===== $app : $exe --silent-install"
            $p = Start-Process -FilePath $exe -ArgumentList '--silent-install' -PassThru `
                   -RedirectStandardOutput "test-logs/$app-stdout.txt" -RedirectStandardError "test-logs/$app-stderr.txt"
            if ($p.WaitForExit(180000)) { Write-Host "exit code del empaquetador: $($p.ExitCode)" } else { Write-Host "el empaquetador sigue vivo; se verifica igual" }
            $dir = Join-Path $env:ProgramFiles $app
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 5
              $svc = Get-Service -Name $app -ErrorAction SilentlyContinue
              if ($svc -and $svc.Status -eq 'Running' -and (Test-Path (Join-Path $dir "$app.exe"))) { $ok = $true; break }
            }
            if (-not $ok) { $fallas += "$app no quedo con el servicio corriendo ni $dir instalado" }
          }
          Start-Sleep -Seconds 10
          foreach ($app in $env:APPS.Split(' ')) {
            # Arranque automatico al encender la PC (para entrar aunque este bloqueada con PIN)
            $w = Get-CimInstance Win32_Service -Filter "Name='$app'" -ErrorAction SilentlyContinue
            if ($w) {
              Write-Host "$app : State=$($w.State) StartMode=$($w.StartMode) StartName=$($w.StartName) Path=$($w.PathName)"
              if ($w.State -ne 'Running') { $fallas += "$app no esta corriendo (State=$($w.State))" }
              if ($w.StartMode -ne 'Auto') { $fallas += "$app StartMode=$($w.StartMode) (se esperaba Auto)" }
              if ($w.StartName -ne 'LocalSystem') { $fallas += "$app StartName=$($w.StartName) (se esperaba LocalSystem)" }
              if ($w.PathName -notlike "*\$app\$app.exe*") { $fallas += "$app apunta a otro exe: $($w.PathName)" }
            } else { $fallas += "no existe el servicio $app" }
            sc.exe qc $app | Out-String | Write-Host
            $dir = Join-Path $env:ProgramFiles $app
            if (Test-Path $dir) { Get-ChildItem $dir | Select-Object -First 30 | Format-Table Name, Length | Out-String | Write-Host }
            $logDirs = @(
              "$env:APPDATA\$app\log",
              "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\$app\log",
              "C:\Windows\System32\config\systemprofile\AppData\Roaming\$app\log"
            )
            $n = 0
            foreach ($d in $logDirs) {
              if (Test-Path $d) { $n++; Copy-Item -Recurse -Force $d "test-logs/$app-log$n" -ErrorAction SilentlyContinue; Write-Host "logs de $d -> test-logs/$app-log$n" }
            }
          }
          Get-ChildItem test-logs -Filter *.txt | ForEach-Object { Write-Host "===== $($_.Name)"; Get-Content $_.FullName -Tail 40 }
          Get-Service | Where-Object { $_.Name -like '*lectronic*' -or $_.Name -like '*ustdesk*' } | Format-Table -AutoSize | Out-String | Write-Host
          Get-ChildItem -Recurse test-logs | Where-Object { $_.Name -like '*.log' } | ForEach-Object {
            Write-Host "===== $($_.FullName)"; Get-Content $_.FullName -Tail 60
          }
          if ($fallas.Count -gt 0) {
            foreach ($f in $fallas) { Write-Host "::error::$f" }
            exit 1
          }
          Write-Host "OK: $($env:APPS) instalados, servicio corriendo, StartMode Auto, LocalSystem"
          if ($env:NEGADO) {
            $n = $env:NEGADO
            Write-Host "===== $n --silent-install (debe negarse: ya esta $($env:APPS))"
            $p = Start-Process -FilePath (Resolve-Path "dist/$n-x64.exe") -ArgumentList '--silent-install' -PassThru
            $null = $p.WaitForExit(120000)
            Start-Sleep -Seconds 30
            if (Get-Service -Name $n -ErrorAction SilentlyContinue) { Write-Host "::error::$n se instalo junto a $($env:APPS)"; exit 1 }
            Write-Host "OK: $n se nego a instalarse junto a $($env:APPS)"
          }

      - name: Captura de la ventana principal
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($app in $env:APPS.Split(' ')) {
            $exe = Join-Path (Join-Path $env:ProgramFiles $app) "$app.exe"
            if (Test-Path $exe) { Start-Process -FilePath $exe; Start-Sleep -Seconds 25 }
          }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force -Path test-logs | Out-Null
          $bmp.Save("test-logs/pantalla.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Write-Host "captura $($b.Width)x$($b.Height)"

      - name: Subir logs de la prueba
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-silent-install-${{ matrix.prueba }}
          path: test-logs

  # Instala la version publicada (releases/latest) y la actualiza con el .exe
  # nuevo por el mismo camino que usa el servicio (--update). Informativa: no
  # frena el release.
  test-update:
    name: prueba actualizacion desde releases/latest
    needs: [build-windows-x64]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: electronics-remote-windows-x86_64
          path: dist

      - name: Aislar la VM del servidor propio
        shell: pwsh
        run: |
          $ips = @()
          foreach ($v in @($env:RENDEZVOUS_SERVER, $env:API_SERVER)) {
            if ([string]::IsNullOrWhiteSpace($v)) { continue }
            $h = (($v -replace '^[a-zA-Z]+://', '') -split '/')[0]
            if (($h.Split(':')).Count -eq 2) { $h = $h.Split(':')[0] }
            $p = $null
            if ([System.Net.IPAddress]::TryParse($h, [ref]$p)) { $ips += $h; continue }
            try { $ips += [System.Net.Dns]::GetHostAddresses($h) | ForEach-Object { $_.IPAddressToString } } catch {}
            Add-Content -Path "$env:windir\System32\drivers\etc\hosts" -Value "0.0.0.0 $h"
          }
          $ips = $ips | Select-Object -Unique
          if ($ips.Count -gt 0) {
            New-NetFirewallRule -DisplayName 'ER-CI-bloquear-servidor' -Direction Outbound -Action Block -RemoteAddress $ips | Out-Null
            New-NetFirewallRule -DisplayName 'ER-CI-bloquear-servidor-in' -Direction Inbound -Action Block -RemoteAddress $ips | Out-Null
          }

      - name: Instalar la publicada y actualizar con la nueva
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $app = 'ElectronicsRemote'
          gh release download --repo $env:GITHUB_REPOSITORY --pattern "$app-x64.exe" -D old
          if (-not (Test-Path "old/$app-x64.exe")) { Write-Host "::warning::no hay release publicado para probar"; exit 0 }
          # El empaquetador se queda vivo tras instalar: no esperar a que salga.
          $null = (Start-Process -FilePath (Resolve-Path "old/$app-x64.exe") -ArgumentList '--silent-install' -PassThru).WaitForExit(180000)
          $exe = Join-Path (Join-Path $env:ProgramFiles $app) "$app.exe"
          for ($i = 0; $i -lt 60; $i++) { if ((Get-Service $app -ErrorAction SilentlyContinue).Status -eq 'Running' -and (Test-Path $exe)) { break }; Start-Sleep 5 }
          if (-not (Test-Path $exe)) { Write-Host "::error::no se instalo la version publicada"; exit 1 }
          $antes = (Get-FileHash (Join-Path (Split-Path $exe) "librustdesk.dll")).Hash
          Write-Host "instalada la publicada: $antes"
          $p = Start-Process -FilePath (Resolve-Path "dist/$app-x64.exe") -ArgumentList '--update' -PassThru
          $null = $p.WaitForExit(300000)
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 5
            if ((Test-Path $exe) -and ((Get-FileHash (Join-Path (Split-Path $exe) "librustdesk.dll")).Hash -ne $antes) -and ((Get-Service $app -ErrorAction SilentlyContinue).Status -eq 'Running')) { $ok = $true; break }
          }
          Get-ChildItem (Split-Path $exe) | Select-Object -First 15 | Format-Table Name, Length, LastWriteTime | Out-String | Write-Host
          foreach ($d in @("C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\$app\log", "$env:APPDATA\$app\log")) {
            if (Test-Path $d) { Get-ChildItem -Recurse $d -Filter *.log | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName -Tail 30 } }
          }
          if (-not $ok) { Write-Host "::error::--update no reemplazo librustdesk.dll o el servicio no quedo corriendo"; exit 1 }
          Write-Host "OK: actualizado en silencio, servicio corriendo"

  release:
    needs: [build-windows-x64, build-android-apk, test-silent-install]
    if: ${{ !cancelled() && (inputs.release_from_run != '' || (needs.test-silent-install.result == 'success' && needs.build-android-apk.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: electronics-remote-*
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.release_from_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WIN_RESULT: ${{ needs.build-windows-x64.result }}
          APK_RESULT: ${{ needs.build-android-apk.result }}
        run: |
          ls -la dist
          # El actualizador de la app baja estos nombres exactos de releases/latest.
          for f in ElectronicsRemote.apk ElectronicsRemote-x64.exe ElectronicsRemote-x64.msi                    ElectronicsRemoteEquipo-x64.exe ElectronicsRemoteEquipo-x64.msi; do
            [ -s "dist/$f" ] || { echo "::error::falta $f (el actualizador no lo encontraria)"; exit 1; }
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
          if [ "$ALLOW_PLACEHOLDER" = "1" ]; then
            FLAG=--prerelease
            NOTE="PRUEBA DE COMPILACION (placeholder): servidor pendiente.invalid y llave original de RustDesk. NO instalar en produccion."
          else
            FLAG=--latest
            NOTE="Servidor: ${RENDEZVOUS_SERVER} | API: ${API_SERVER:-http://<servidor>:21114}"
          fi
          {
            echo "Electronics Remote ${ER_VERSION} (basado en RustDesk ${VERSION}, AGPL-3.0, uso interno)."
            echo
            echo "$NOTE"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Corrida: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Windows x64: ${WIN_RESULT} | Android universal: ${APK_RESULT}"
            echo "- Version: ${ER_VERSION}"
            echo "- Actualizador: busca ElectronicsRemote-x64.exe / ElectronicsRemote-x64.msi / ElectronicsRemote.apk en releases/latest de este repo."
            echo "- ElectronicsRemoteEquipo-x64.exe (.msi): Electronics Remote Equipo, SOLO RECIBIR, para las PCs que solo se controlan (servicio ElectronicsRemoteEquipo, arranque automatico)."
          } > notes.md
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${RELEASE_TAG}" -f sha="${GITHUB_SHA}"             || echo "::warning::no se pudo crear el tag por API (ver arriba)"
          gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" \
            --title "Electronics Remote ${ER_VERSION}" --notes-file notes.md $FLAG
